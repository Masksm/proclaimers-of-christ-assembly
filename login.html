<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>Account Access | Proclaimers of Christ Assembly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="index.html"><span class="auth-mark">✝</span><span>PROCLAIMERS<small>OF CHRIST ASSEMBLY</small></span></a>
    <section class="auth-card">
      <p class="auth-eyebrow">CHURCH COMMUNITY</p>
      <h1 id="form-title">Welcome back.</h1>
      <p class="auth-intro" id="form-intro">Sign in to access your church account.</p>
      <button class="google-button" id="google-button" type="button"><span class="google-g">G</span> Continue with Google</button>
      <div class="auth-divider"><span>or continue with email</span></div>
      <form id="auth-form">
        <label for="full-name" id="name-label" hidden>Full name</label>
        <input id="full-name" name="full-name" type="text" autocomplete="name" placeholder="Your full name" hidden>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" required>
        <button class="auth-submit" id="submit-button" type="submit">Sign in</button>
      </form>
      <button class="text-button" id="forgot-button" type="button">Forgot password?</button>
      <p class="auth-switch" id="switch-copy">New here? <button id="switch-button" type="button">Create a member account</button></p>
      <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
    </section>
    <a class="back-home" href="index.html">Back to church website</a>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
